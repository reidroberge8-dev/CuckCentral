<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuckville Cucks War Room 2026</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
<header>
  <h1>Cuckville Cucks War Room 2026 <span class="sub">Custom Scoring</span></h1>
  <div class="status-bar">
    <span id="sync-status">Loading draft board&hellip;</span>
    <button id="refresh-btn" title="Refresh now">&#8635; Refresh</button>
  </div>
</header>

<div class="page">

<aside id="roster-sidebar">
  <div id="activity-box">
    <h2>Recent Activity</h2>
    <div id="activity-list" class="activity-list"></div>
  </div>
  <div class="roster-header">
    <h2>Reid/Mike Roster</h2>
    <button id="roster-toggle" title="Hide roster">&times;</button>
  </div>
  <div id="roster-body">
    <div class="roster-section-label">Starters</div>
    <table class="roster-table" id="starters-table"></table>
    <div class="roster-total" id="starters-total"></div>
    <div class="roster-section-label">Bench</div>
    <table class="roster-table" id="bench-table"></table>
  </div>
</aside>

<main>
<div class="controls">
  <input type="text" id="search" placeholder="Search player or team...">
  <div class="pos-filters" id="pos-filters"></div>
  <label class="avail-toggle">
    <input type="checkbox" id="hide-drafted"> Hide drafted
  </label>
  <label class="avail-toggle">
    <input type="checkbox" id="show-starred-only"> Starred only
  </label>
  <span id="count-label"></span>
</div>

<div class="table-wrap">
<table id="player-table">
  <thead>
    <tr id="header-row"></tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>
</div>
</main>

</div>

<footer>
  Custom league scoring (6pt PaTD, 0.2 PPR). Projections: ESPN Mike Clay 2026 draft kit.
  Draft board synced live from <a id="sheet-link" href="#" target="_blank">Google Sheet</a>.
</footer>

<script src="app.js"></script>
</body>
</html>
