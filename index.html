<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR East Fantasy Draft Board 2026</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
<header>
  <h1>2026 Fantasy Draft Board <span class="sub">Custom Scoring</span></h1>
  <div class="status-bar">
    <span id="sync-status">Loading draft board&hellip;</span>
    <button id="refresh-btn" title="Refresh now">&#8635; Refresh</button>
  </div>
</header>

<div class="controls">
  <input type="text" id="search" placeholder="Search player or team...">
  <div class="pos-filters" id="pos-filters"></div>
  <label class="avail-toggle">
    <input type="checkbox" id="hide-drafted"> Hide drafted
  </label>
  <span id="count-label"></span>
</div>

<div class="table-wrap">
<table id="player-table">
  <thead>
    <tr>
      <th data-key="posRank">Pos Rk</th>
      <th data-key="name">Player</th>
      <th data-key="pos">Pos</th>
      <th data-key="team">Team</th>
      <th data-key="customPts" class="sort-default">Proj Pts</th>
      <th data-key="statline">Key Stats</th>
      <th data-key="status">Status</th>
    </tr>
  </thead>
  <tbody id="table-body"></tbody>
</table>
</div>

<footer>
  Custom league scoring (6pt PaTD, 0.2 PPR, IDP tkl/sack/INT). Projections: ESPN Mike Clay 2026 draft kit.
  Draft board synced live from <a id="sheet-link" href="#" target="_blank">Google Sheet</a>.
</footer>

<script src="app.js"></script>
</body>
</html>
